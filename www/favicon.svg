<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Pozadí gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002244"/>
      <stop offset="50%" stop-color="#003b73"/>
      <stop offset="100%" stop-color="#0055a5"/>
    </linearGradient>

    <!-- Urna gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Hlasovací lístek gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Zlatý pruh gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f4b400"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Zelená fajfka gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Stín -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="paperShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Podklad ikony se zaoblenými rohy -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- HLASOVACÍ LÍSTEK (vhazovaný shora do urny) -->
  <g filter="url(#paperShadow)">
    <rect x="166" y="70" width="180" height="210" rx="16" fill="url(#paperGrad)" stroke="#cbd5e1" stroke-width="3"/>
    
    <!-- Řádky textu na lístku -->
    <rect x="196" y="105" width="120" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="196" y="130" width="85" height="10" rx="5" fill="#e2e8f0"/>
    
    <!-- Čtvereček pro hlasování -->
    <rect x="196" y="160" width="46" height="46" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
    
    <!-- Zelená fajfka ✓ v hlasovacím poli -->
    <path d="M 205 183 L 217 195 L 235 170" fill="none" stroke="url(#checkGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="254" y="172" width="62" height="10" rx="5" fill="#94a3b8"/>
    <rect x="254" y="190" width="45" height="8" rx="4" fill="#cbd5e1"/>
  </g>

  <!-- HLASOVACÍ URNA (Spodní skříňka) -->
  <g filter="url(#dropShadow)">
    <!-- Tělo urny -->
    <rect x="100" y="225" width="312" height="225" rx="24" fill="url(#boxGrad)"/>
    
    <!-- Víko urny -->
    <rect x="80" y="205" width="352" height="48" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Vhazovací otvor pro lístky (Slot) -->
    <rect x="150" y="221" width="212" height="14" rx="7" fill="#0f172a"/>

    <!-- Zlatý ozdobný pruh na urně -->
    <rect x="100" y="295" width="312" height="24" fill="url(#goldGrad)"/>

    <!-- Symbol na přední straně urny (Znak hlasování / pečeť) -->
    <circle cx="256" cy="370" r="38" fill="#003b73"/>
    <circle cx="256" cy="370" r="34" fill="none" stroke="#f4b400" stroke-width="3"/>
    
    <!-- Velká bílá fajfka na pečeti urny -->
    <path d="M 242 370 L 252 381 L 271 358" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
