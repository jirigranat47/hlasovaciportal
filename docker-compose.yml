services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hlasovaciportal_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    environment:
      NETTE_ENV: dev
      DB_HOST: db
      DB_NAME: hlasovaciportal
      DB_USER: hlasovani
      DB_PASSWORD: hlasovani_pass
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: hlasovaciportal_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_pass
      MYSQL_DATABASE: hlasovaciportal
      MYSQL_USER: hlasovani
      MYSQL_PASSWORD: hlasovani_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/structure.sql:/docker-entrypoint-initdb.d/01-structure.sql:ro

  adminer:
    image: adminer:latest
    container_name: hlasovaciportal_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  db_data:
